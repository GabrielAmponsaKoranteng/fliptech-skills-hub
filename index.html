<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare course fees, duration, intake dates and verified training providers in Greater Accra." />
    <meta name="theme-color" content="#7c3aed" />
    <!--
      Link previews (WhatsApp, Facebook, X, LinkedIn). Preview bots don't run the app's JavaScript,
      so every shared link shows these site-wide tags. The app updates them per page for browsers;
      per-page previews for bots need the server to fill them in (docs/API.md, "Link previews").
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fliptech Skills Hub" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:title" content="Fliptech Skills Hub — Find. Learn. Create. Sell." />
    <meta property="og:description" content="Compare course fees, duration, intake dates and verified training providers in Greater Accra." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1791511241332-a712092ecfe1?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=70" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/brand/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Most pictures come from this host; connecting early saves a round trip on the first image. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!--
      Fonts load without blocking the first paint: the page shows in the fallback font and swaps when
      they arrive. Plus Jakarta Sans is the variable font, so one file covers every weight the CSS uses
      (400–800, including 550/650/750). Caveat is only drawn on the homepage, at 700.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" /></noscript>
    <title>Fliptech Skills Hub — Find. Learn. Create. Sell.</title>
  </head>
  <body>
    <!-- Shown until the app starts, so slow connections see something straight away. React replaces it. -->
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#f5f0ff,#fff 60%);font-family:system-ui,sans-serif;color:#5b6b80" role="status"><div style="display:grid;justify-items:center;gap:14px"><svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><g opacity=".92"><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#5b21b6"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#6d28d9" transform="rotate(45 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#7c3aed" transform="rotate(90 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#9333ea" transform="rotate(135 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#a855f7" transform="rotate(180 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#c026d3" transform="rotate(225 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#db2777" transform="rotate(270 24 24)"/><path d="M24 24C24 14 30 6 38 6 38 14 32 22 24 24Z" fill="#ec4899" transform="rotate(315 24 24)"/></g><circle cx="24" cy="24" r="3.2" fill="#fff"/></svg><span style="font-size:14px">Loading Fliptech Skills Hub…</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
